            <div class="fulltext-meta">

        <div class="fulltext-highlight">
            <h4>原标题：腾讯最强的牌，也是AI最大的锁</h4>
            <p><strong>中文摘要：</strong> 本文分析了腾讯在AI时代的战略转型。面对大模型初期的落后，腾讯不再盲目追求独立AI应用，而是转向夯实底层模型（混元3.0）并将AI融入现有业务生态。随着Agent浪潮兴起，微信凭借高频入口和丰富小程序成为腾讯最大优势，但用户信任和生态平衡也成为其最大束缚。6月2日微信即将上线AI助手，标志着腾讯在克制与试探中，正式迈出将微信打造为AI操作系统的关键一步。</p>
        </div>
        
        <div class="fulltext-content">
<![CDATA[6月2日，据多家媒体报道，微信即将上线一个AI助手。用户在主界面右滑就能进入聊天窗口，输入指令即可调用微信里的数百万个小程序。
打车、订餐、买菜、订票……理论上，微信生态里任何一个长尾服务，都可以被一句话调起来。
这是微信十五年来，第一次把AI智能体放到与“消息”几乎平起平坐的位置。
过去一整年，这个产品是腾讯AI叙事里最大的悬念。外界都想知道，坐拥十四亿月活的微信，会不会让一个AI智能体跑进自己的聊天界面。
直到6月2日早上，这个答案才第一次开始浮现。
而就在不到三周前，2026年5月13日，腾讯股东大会上，有人问马化腾，腾讯的AI是不是落后了。
马化腾的回答后来被广泛引用。他说，一年前以为上了船，后来发现船漏了；现在感觉站上去了，还坐不下去，希望船速能再快一点。
说这话时，腾讯的AI助手元宝，在2026年春节10亿现金红包活动之后，月活也回落到了4000万出头。根据QuestMobile数据，这个规模与字节的豆包之间，差距约六倍。
按腾讯过去二十年的路径——后发，然后用产品体验和分发能力慢慢追上——这种局面本来不该出现。
但更让外界关注的，是它接下来的动作。
![Image 1](https://img.36krcdn.com/hsossms/20260603/v2_95fdbd6a6ec54182be8485fa95dd281f@5349838_oswg606429oswg1080oswg607_img_000?x-oss-process=image/format,jpg/interlace,1)
它没有继续加注元宝。今年4月，腾讯发布了几乎被重新构建的自研大模型混元3.0。主导者是腾讯从OpenAI请回的青年科学家姚顺雨，据公开报道，他直接向总裁刘炽平汇报。一个多月前的3月，腾讯撤销了成立整整十年的AI Lab，人员并入混元体系。
一家擅长应用的公司，在应用产品上节奏放缓之后，没有去追产品，反而回头去修一个用户根本看不见的底层模型。
5月13日的那番坦诚表态，与6月2日浮现的微信AI助手，中间这二十天里发生的事，几乎是腾讯过去一年多AI战略的全部缩影。
补地基、想清楚要打哪场仗、然后开始试探最难的那一关。
## **AI第一阶段，腾讯找节奏**
腾讯几乎从来不是第一个掌握底层技术的公司。
QQ不是中国第一个即时通讯软件，微信不是第一个移动社交产品，游戏业务里相当一部分是代理。它真正擅长的，是另一件事。
等一项新技术、一个新场景慢慢长出形状，然后用流量、关系链和股权投资三件套，把它收进自己的生态。
2015年春节的微信红包，是这套打法最干净的一次演示。当时移动支付几乎是支付宝的天下，腾讯没有发明任何新技术，只是用一个红包功能，借社交关系链把微信支付带到了更多用户面前。
腾讯的应用驱动思维，在马化腾很早期的判断里就写得很清楚。他说，中国的互联网很多是靠应用驱动的，而不是靠技术。
2015年，他把这套打法总结成另一句，“把半条命交给合作伙伴”。腾讯专注股权投资，把新赛道的伙伴变成生态的一部分，再用微信、QQ、游戏内容的流量池打辅助，几乎在每个新赛道都拿到了入场券。
这套方法奏效了二十年，直到AI出现。AI的第一波浪潮里，腾讯的节奏明显放缓了。
据公开信息梳理，从2023年到2025年，腾讯在大模型公司、芯片算力和应用层都有出手——投了Minimax、智谱、月之暗面等多家头部模型公司，但更多是占位和观察，而不是All in。
问题在于，这一次几乎所有创新都围绕同一样东西在爆发——大模型。而它进步得太快，每隔几周就换一副面孔，几乎没有“稳定的形状”可以等。
腾讯过去引以为傲的耐心，这一次没有像以往那样转化成优势。它的两个主要对手，都没有等。
阿里押的是底座。它把通义大模型几乎全部开源，意在像安卓那样吸引开发者生态，并对外宣布三年投入约3800亿用于AI算力和基础设施建设。逻辑是：不一定做最好用的AI，但要做所有AI脚下的那一层地。
![Image 2](https://img.36krcdn.com/hsossms/20260603/v2_9834b8f351db4adb8d08afff8d87fb7e@5349838_oswg21178oswg750oswg500_img_000?x-oss-process=image/format,jpg/interlace,1)
字节押的是C端App。它把豆包做成一个想打进每个人手机里的国民AI助手，并把这套增长方法论复制到剪映、即梦、飞书、Trae等多个产品上。
截至2026年3月，QuestMobile数据显示，豆包月活约2.26亿，排在DeepSeek的1.35亿之后，形成断层领先；元宝约4100万，位居第三。
腾讯的处境则微妙得多。
5月13日的一季度财报里，AI驱动的广告推荐让营销服务收入同比增长20%，AI优化的算法让视频号总用户时长同比增长超过20%。
更值得注意的是，腾讯专门在财报里把元宝、混元、CodeBuddy、WorkBuddy、QClaw这五项新AI产品的财务影响单独披露——含进去，Non-IFRS经营利润同比增长9%；剔除后增长17%。一来一去差出来约88亿，就是这一季腾讯为AI主动承担的、看得见的成本。
从财务披露角度看，核心业务在加速，AI已经被消化进存量业务并带来实质增益，新AI产品的成本可控且可计算。
但市场反响并不热烈。一位长期跟踪腾讯的分析师对媒体说，问题不在数字，在心智。投资人认知里，阿里的故事是云和底座，字节的故事是豆包，但腾讯的AI故事，一句话说不清楚。
它什么都有，但没有占据AI时代任何一个锋利的位置。
## **元宝不是答案，混元才是补丁**
腾讯当然也在尝试。
春节，元宝推出10亿元现金红包，是2015年微信红包之后单个产品规模较大的一次现金活动。广告铺满微信、小红书、B站，据QuestMobile数据，腾讯在AI应用上的硬广投放占比一度高达38%，行业最高，甚至刷上了乡村的围墙。
短期效果有。元宝月活短暂冲到1.14亿，DAU突破5000万。然后，红包活动结束，数据回落。
这件事让外界看清了一件事：在AI产品上，流量打法的效果不像过去那样持续。AI助手的核心，不在营销预算里，而在背后那个模型本身的能力。元宝、豆包这类Chatbot，本质上不是AI竞争的地基，而是模型能力派生出来的产品形态——能不能长大，取决于底层模型本身。
据公开报道，马化腾在2026年1月的腾讯年会上提到，腾讯AI“动作慢了”，问题可能出在基础设施不足、模型迭代频率和平台能力需要提升。
这之后，一场静悄悄的组织调整开始了。
一季度财报里，腾讯的资本开支付款约370亿，主要用于支持AI相关投入。研发开支同比增长约19%，达到225亿，其中超过七成是雇员福利开支——简单理解，就是在人才上加大投入。
![Image 3](https://img.36krcdn.com/hsossms/20260603/v2_8436561f5adc43d99e03c02c677d399f@5349838_oswg42257oswg1080oswg720_img_000?x-oss-process=image/format,jpg/interlace,1)
据公开报道，腾讯把姚顺雨挖来，任命为总裁办首席AI科学家，兼任AI Infra和大语言模型负责人，直接向刘炽平汇报。3月，腾讯撤销成立于2016年、过去十年里曾汇聚过多位顶级科学家的AI Lab，人员并入混元的预训练、后训练、Baseline Infra等不同板块。
有内部人士对媒体表示，AI Lab的归属、考核、研究方向长期不清晰，撤销并非突发动作，更像是一次顺势的整合。
4月推出的混元3.0，刻意没有去对标最前沿模型。它的设计哲学被概括为四个字：够用、便宜。
总参数2950亿、激活210亿，不追万亿规模，主打推理效率和成本优化。它对外的定位是参与智能体市场；对内的第一个任务，是让QQ浏览器、微信搜索这些核心产品，逐步减少对外部模型的依赖。
自4月28日以来，据腾讯方面披露，以token消耗量计，Hy3 preview已成为OpenRouter上使用最广泛的模型之一。
补地基，是为了把命脉攥回自己手里。
## **把AI埋进生态**
补好地基之后，腾讯要在上面盖什么样的楼？答案藏在一件被广泛讨论过的“冲突”里。
元宝那次10亿红包活动期间，当分享链接铺满朋友圈时，微信对相关链接做了限制处理。
外界有很多种解读。可以理解为微信担心元宝抢走自己的生态位；也可以理解为张小龙在守护微信的低打扰、高信任规则。
这两种说法都对。但这件事的真正意义，是它让腾讯AI战略的一个内在矛盾，第一次摆到了台面上——如果连自家微信，都不愿意让一个独立AI App撬动自己的社交关系链，那么腾讯试图复制一个“豆包式”独立App的路径，从一开始可能就是拧巴的。
据多家媒体报道，春节后，腾讯开始换一种方式让元宝进入微信。以“元宝红包封面助手”为载体，逐步以“AI版文件传输助手”的形态进入微信聊天界面，获得置顶、分享、互动权限。
到3月下旬，用户已经可以在微信里搜索元宝、把它添加为好友，在聊天界面与它互动。
元宝不再是那个试图从外部撬动关系链的独立App，而是被收编成了微信里一个受控的AI助手。
这背后是腾讯AI战略一次悄悄的转向。它不再试图复制一个豆包，也不再押注一个能引爆的爆款。它真正在做的事情是另一件——把AI埋进它已有的每一条旧业务线里：广告推荐、视频号、微信搜索、AI客服、游戏、企业微信。
财报里那些看上去不显眼的数字，才是这套战略的真实成果。
营销服务收入因为AI广告推荐增长20%；视频号时长增长20%；AI智能投放产品AIM+赋能了约30%的广告投放金额；WorkBuddy据腾讯披露，以日活计已经是国内使用最广的效率类AI智能体服务之一。
长城证券的一份研报点破了这套逻辑：把DeepSeek和元宝嵌入微信搜索，本质是把AI当作连接整个微信生态的超级枢纽，触达十几亿用户数据，让微信进化成一个AI操作系统。
这些AI的成果，不像独立的AI胜利，更像旧业务变得更好。所以市场对它的关注度不高。但腾讯AI战略的真正形状，就在这里。
不是All in一个AI App，而是All in一个被AI重新改造过的腾讯生态。它被微信、QQ、游戏、支付这一整套已有的盘子，塑造成了今天这个样子。
## **Agent给了微信一张主场票**
如果说第一阶段的Chatbot战场不在腾讯的舒适区里，那么2026年3月以来的Agent浪潮，正在把它拉回主场。
3月初，一个叫OpenClaw的开源AI助手在中国快速走红。它和聊天机器人不一样——能调用工具、长时间在线，一步步替你把事情办完。被网友谐音叫成“龙虾”之后，使用OpenClaw也被称作“养龙虾”。
腾讯的反应，比它平时积极得多。3月6日，它在深圳办了一场免费帮市民安装OpenClaw的线下活动，原计划小规模，结果来了800多人，最远从杭州赶来。
3月9日，腾讯推出WorkBuddy。3月11日凌晨，马化腾本人在朋友圈一口气列举着自家的“龙虾”产品矩阵——自研龙虾、本地虾、云端虾、企业虾、云桌面虾。
![Image 4](https://img.36krcdn.com/hsossms/20260603/v2_bee5bddff7354d7285aef4657df1025c@5349838_oswg64171oswg590oswg500_img_000?x-oss-process=image/format,jpg/interlace,1)
据统计，腾讯至少有三个事业群、超过10款Claw类产品已经上线、内测或在研。
腾讯云开发者AI产品负责人丁宁后来在媒体沟通会上说，WorkBuddy的产品早在1月17日那个周末就已经启动，几个产品和运营熬一夜做出了MVP版本。
腾讯轻量云产品总监钟宇澄也说，他们原计划3月16日发布，看到外部“养龙虾”热情高、安装又困难，把发布提前了一周。
这种节奏对一向以克制著称的腾讯来说，并不常见。
它积极的原因不复杂。当AI从“会说话”变成“会办事”，比赛的规则变了。
第一阶段比的是谁的模型更强，这是腾讯相对薄弱的环节；但Agent比的是谁手里有最高频的入口、最深的场景、最丰富的可调用服务，这恰好是腾讯的家底。十四亿用户每天打开的微信、几百万个小程序、无处不在的支付、关系链。
一个能办事的Agent需要的所有事，几乎都在腾讯的生态里。
3月18日的财报电话会上，马化腾把OpenClaw这类应用称为继ToC聊天机器人、ToB编程助手之后的“第三大AI落地场景”。前两个赛道分别跑出了ChatGPT和Claude Code。
腾讯要押第三个。
## **它戴着镣铐，直到6月2日**
只是当腾讯准备大干一场时，它低头发现，锁住自己脚的，不是别人，正是它手里最大的那张牌，微信。
只是当腾讯准备大干一场时，它低头发现，锁住自己脚的，不是别人，正是它手里最大的那张牌——微信。
微信几乎是为AI Agent量身定做的——没有任何一个产品比它更高频、场景更深、数据沉淀更厚。但微信同时也是全中国最不能“激进”的地方。
这是一个由两个解不开的结构成的悖论。
第一个结，是用户信任。一个真正好用的微信Agent，必须理解你——知道你和谁聊天、在哪些群里、最近讨论过什么、用过哪些小程序、付过哪些钱。这正是它做Agent最大的优势，也最敏感。每多读一层数据，就多一层信任风险。微信是国内互联网生态里很重要的信任壁垒，一旦松动，这块壁垒就难以修复。
这就是为什么，腾讯前不久向第三方AI开放微信的那道口子——ClawBot插件，虽然被称作微信十多年来首次向第三方AI工具开放个人用户级原生通道，但限制重重：不能进群，不能与微信数据层打通，一次只能连接一只龙虾。更像一种战略占位。
如果Agent做得太好，用户一句话就闭环了，那些原本靠页面展示、搜索排序、群运营、直播讲解触达用户的商家，会失去自己的生意。可如果Agent能力不足，用户体验又难以与豆包等竞品对齐。
![Image 5](https://img.36krcdn.com/hsossms/20260603/v2_dad8eea37aeb439cbf55f7c38617b1ef@5349838_oswg47158oswg1080oswg809_img_000?x-oss-process=image/format,jpg/interlace,1)
做得太强，会冲击生态平衡。做得太弱，又难以留住用户。
2025年12月，字节发布了一部豆包手机，用户用语音就能完成订餐、打车、发消息等操作，几乎不用打开任何App。腾讯随后对它在微信里的调用做了限制。这件事让腾讯意识到，Agent时代，微信被绕过的可能性是真实存在的。但它自己想做这个Agent时，又被上面那两个结牢牢拽住。
也正因为这两个结的存在，直到5月13日马化腾说“坐不下去”那一刻，外界对微信原生AI智能体的预期里，都隐含着一个怀疑，它真的会做出来吗？
然后就是6月2日。
微信即将上线AI助手的消息，本质上是一个回答。会做，但要试着来。
按公开消息的描述，这个微信AI助手的形态——主界面右滑、调起小程序——是一个非常微妙的设计。它没有放在聊天列表最上面、没有占据消息流的位置、没有取代任何已有的入口，而是在“主界面右滑”这个动作下面新开了一条路径。这是一个克制的、可观察的、可回退的伸脚。
它意味着，微信第一次正式接纳“AI智能体”成为一个跟“聊天”并行的产品形态。它意味着，腾讯不再满足于把AI埋进搜索框、埋进朋友圈推荐摘要这种最不打扰用户的位置，而是给了AI一个独立的入口。
它也意味着，腾讯终于愿意拿微信里的小程序生态，放进AI智能体里去尝试。
外界对此关注度高，不是因为这个产品已经被验证好用，目前还没有人正式体验过完整形态。关注度高，是因为这个动作本身，是腾讯过去一年AI叙事里最大的那个悬念第一次被部分回答。
但要把这一脚理解为“自我革命”，还为时尚早。那两个结，并没有因为6月2日的消息就解开。
而这些问题，恰恰是判断这个产品到底是“占位式开放”，还是能指引微信成为真正的AI智能体方向的核心。
也许马化腾自己，也还在等。
3月18日他在财报电话会上说，微信AI的设计很复杂，大家可能要有点耐心，慢工出细活。
6月2日的版本，是这场“慢工”第一个试探的开始。它能走多深、能让出多大的生态空间，还得看接下来几个月。
