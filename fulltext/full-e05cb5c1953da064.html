        <div class="fulltext-highlight">
            <h4>原标题：Waze adds new AI-powered features and customization updates</h4>
            <p><strong>中文摘要：</strong> 谷歌旗下导航应用Waze推出由Gemini AI驱动的新功能及自定义更新。新功能包括基于用户习惯的个性化导航、通过对话式AI查找目的地、专为两轮车设计的摩托车模式、自然语音报告地图更新以及减少干扰的“少话”模式。这些更新旨在提升用户体验并增强其市场竞争力。</p>
        </div>
        
        <div class="fulltext-content">
<![CDATA[URL Source: https://techcrunch.com/2026/07/13/waze-adds-new-ai-powered-features-and-customization-updates/
Published Time: 2026-07-13T14:18:16+00:00
Markdown Content:
谷歌旗下的导航应用Waze正在推出新的[AI驱动功能和自定义更新](https://blog.google/waze/waze-updates-gemini-motorcycle-mode/)，包括以对话方式报告路况更新以及获取个性化导航的能力。

部分新功能由谷歌的Gemini AI助手提供支持，这反映了这家科技巨头将Gemini整合到其产品中的更广泛举措，同时也使Waze能够更好地与Apple Maps等竞争服务抗衡。

该应用现在会根据用户的行程历史及其对城市交通模式的理解来建议路线。例如，如果用户更喜欢在高速公路上行驶而不是地方街道，他们会首先看到这些建议。如果用户不想要个性化路线，可以在设置中选择备用路线或完全关闭个性化功能。个性化导航目前正在全球范围内的Android和iOS上推出。

用户现在还可以使用Gemini，在知道自己需要什么但不确定具体去哪里时，通过快速聊天找到目的地。用户可以点击搜索语音图标提问，例如“帮我找一家现在营业的咖啡店”、“帮我找离Grand Mall很近的停车场”或“帮我找附近油价最低的加油站”。然后Waze会回复一个选项列表。

使用Gemini功能查找目的地的能力目前正在向全球Android和iOS上的Waze测试版社区推出。

![Image 1](https://techcrunch.com/wp-content/uploads/2026/07/Screenshot-2026-07-13-at-10.12.41-AM.png?w=680)
**图片来源：**Waze

此外，Waze正在引入一种新的摩托车模式，该模式使用AI来考虑两轮车专属的捷径和道路限制，以帮助骑手找到最佳路线并获得更准确的预计到达时间（ETA）。它还会显示可能对骑手造成困难的危险，如坑洼、减速带、凸起的人行横道、路肩尽头和窄桥。

Waze表示，摩托车模式目前正在阿根廷、巴西、哥伦比亚、马来西亚、墨西哥、秘鲁和菲律宾的Android和iOS上推出，未来将支持更多国家。

![Image 2](https://techcrunch.com/wp-content/uploads/2026/07/map_mate_english.width-1000.format-webp.webp?w=680)
**图片来源：**Waze

虽然Waze已经允许用户使用自然语音报告交通事件（如减速），但它现在也允许用户以同样的方式建议地图更新，包括报告道路封闭或过时的地址。

例如，你可以说“这里道路封闭了”，Waze会将这些详细信息发送给当地地图编辑。以对话方式报告路况更新的选项目前正在全球范围内的Android和iOS上推出。

还有一种新的“少话”模式，当你想专注于音乐或播客时，它可以减少驾驶过程中的干扰。当你开启该设置时，Waze会尽量减少语音提示的数量并保持简短。你仍然会收到危险和转弯的提醒，但频率会降低。“少话”模式目前正在全球范围内的Android和iOS上推出。
