# 凯蒂·豪恩为新风投基金筹集10亿美元
前安德森·霍洛维茨（a16z）投资者凯蒂·豪恩周一在[一份新闻稿](https://www.haun.co/writing/fundii)中宣布，她的公司已通过新基金筹集了10亿美元，以继续其支持加密货币和区块链的论点。
据[彭博社报道](https://www.bloomberg.com/news/articles/2026-05-04/crypto-investor-haun-raises-1-billion-for-funds-expands-to-ai-agents)，这笔资金将分布处于早期和后期阶段的初创企业，并且在加密货币和区块链领域内，将用于支持专注于另类资产（[如黄金和其他大宗商品](https://techcrunch.com/2026/04/14/financial-risk-management-platform-pillar-raises-20m-seed-in-round-led-by-a16z/)）、智能体经济和金融服务的初创企业。
该公司希望在未来两到三年内在全球范围内部署这笔资金。豪恩于2021年底离开a16z，并在不久后的2022年创立了自己的风险投资公司。据 PitchBook 估计，该公司管理的资产超过20亿美元，其投资包括 Palmer Luckey 的 Erebor 银行和加密金融公司 Ellipsis Labs。
