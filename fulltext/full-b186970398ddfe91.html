<![CDATA[
文章标题：使用低秩混合模型简化流匹配变换

Liam A. Kruse, Houjun Liu, Alexandros E. Tzikas, Mansur M. Arief, 和 Mykel J. Kochenderfer

L. A. Kruse (通讯作者), H. Liu, A. E. Tzikas, 和 M. J. Kochenderfer 就职于美国斯坦福大学航空航天系斯坦福智能系统实验室 (Stanford Intelligent Systems Laboratory in the Department of Aeronautics and Astronautics at Stanford University, Stanford, CA 94305, USA) (email: {lkruse, houjun, alextzik, mykel}@stanford.edu)。M. Arief 就职于沙特阿拉伯法赫德国王石油矿物大学 (KFUPM) 工业与系统工程系 (Industrial and Systems Engineering Department at King Fahd University of Petroleum and Minerals, Dhahran, 31261, KSA) (email: mansur.arief@kfupm.edu.sa)。

### 摘要
归一化流是强大的生成模型，能够学习复杂数据分布与简单潜在分布（通常是标准正态密度）之间的可逆映射。然而，由于潜在密度与数据密度之间的拓扑不匹配，这种潜在密度的选择会给学习到的流变换带来不必要的复杂性，导致训练速度变慢和性能次优。在这项工作中，我们提出使用概率主成分分析器混合模型（MPPCA）作为归一化流的潜在密度。我们通过学习在KL散度上更接近数据分布的潜在分布来简化学习到的流变换，从而实现更快的收敛和改进的生成性能。关键的是，MPPCA模型可以使用期望最大化算法快速且低成本地拟合，使其成为初始化潜在分布的实用选择，即使在高维生成任务中也是如此。我们在表格和图像数据集上验证了我们的方法，与基线相比，在训练效率和生成质量上表现出一致的提升。

### I 引言
归一化流是一类生成模型，它学习复杂的数据密度和更简单的基础密度之间的确定性、可逆映射，从而实现采样和密度估计 [25]。连续归一化流（CNF）通过将变换参数化为常微分方程（ODE）的解来扩展该框架 [3]。学习到的向量场，例如积分映射，在将样本从基础密度传输到目标数据密度时，会诱导一个前推概率分布。早期的CNF模型通过最大似然估计进行训练，需要通过学习到的ODE动力学进行昂贵的模拟 [8]。最近，流匹配目标的发展允许通过直接回归到ODE向量场，以无模拟的方式训练流，类似于用于训练扩散模型的方法 [16]。流匹配（FM）使可扩展的流能够执行高维任务，如图像生成、图像转换和学习单细胞动力学 [30]。

**图 1**：通过流模型的积分路径不是唯一的，并且可能不必要地复杂（左）。使用OT原理的流匹配产生更直的路径（中）。我们提出低秩基础密度来进一步简化学习到的流变换（右）。

不幸的是，学习到的积分映射并不是唯一的，因为不同的动力学和积分路径仍然可以诱导相同的前推密度。具有不必要复杂动力学的变换会增加推理时的计算成本。条件较差的动力学需要更多的时间步长供自适应步长求解器求解ODE [5]，并导致固定步长求解器出现更大的时间离散化误差，最终降低生成样本的质量 [17]。为了解决CNF训练的这一缺点，引入了归纳偏置以鼓励更简单和更高效的变换。例如，引入了最优传输（OT）原理来正则化学习到的动力学 [5]，并鼓励数据和基础密度之间有更直的路径 [30, 24]。在这项工作中，我们学习具有表现力的基础分布以简化学习到的流变换，并为训练过程提供归纳偏置，如图1所示。虽然流模型通常依赖于简单的标准正态基础密度以允许易于处理的密度估计，但我们提出了概率主成分分析器混合模型（MPPCA）[29]——一种低秩高斯混合模型——作为一种更灵活的替代方案。MPPCA模型提供了两个关键特征：1）它们具有解析的似然表达式，保留了密度估计所需的计算效率；2）即使在高维数据上，也可以使用期望最大化（EM）算法高效地拟合它们。通过初始化基础分布以紧密近似目标数据分布，我们的方法降低了学习到的CNF变换的复杂性，从而实现更快的收敛和改进的生成性能。在实践中，我们的方法热启动了流训练过程，用少量高效的EM步骤代替了许多迭代的基于梯度的优化。我们的具体贡献包括：
- 我们使用MPPCA模型为流构建了具有表现力的基础分布，并证明与流训练过程相比，MPPCA拟合过程在计算上是低成本的。
- 我们表明MPPCA基础分布可以与基于最优传输的流匹配目标相结合，以生成更高质量的样本，同时减少推理时的积分步数。
- 我们在具有挑战性的密度估计和生成任务（包括在高维图像数据集上训练）上定量评估了我们的方法。

### II 相关工作
先前的一些工作研究了基础密度对流性能和训练特性的作用。[23]比较了标准正态基础密度与用于分布估计的掩码自编码器 [6]，发现标准正态密度在大多数数据集上具有竞争力。研究人员注意到，高斯混合模型（GMM）基础密度可以提高分类性能，因为来自特定类别的数据样本被映射到特定的潜在混合分量 [2, 12]。在这项工作中，我们不关心分类，而是关心无条件密度估计和采样。此外，[2]假设混合分量具有单位协方差矩阵，而[12]随机初始化混合均值，并且没有将它们与流参数一起拟合。我们学习接近真实数据密度的基础密度，并在训练流之前使用EM算法拟合MPPCA模型。[9]也使用GMM作为基础密度，并证明将基础密度拆分为多个模式可以控制可逆神经网络的Lipschitz常数。他们使用启发式方法选择GMM分量均值，而我们直接将我们的拟合到数据密度。[28]基于学习到的拒绝采样开发了一种用于归一化流的基础分布。他们的目标是更好地建模具有复杂拓扑结构支持的目标分布。然而，他们的基础分布不能直接评估，因为归一化常数未知。相比之下，MPPCA模型允许精确的似然计算，保留了整个流模型的密度估计能力。

直观地说，具有表现力的基础密度作为一种归纳偏置，通过降低流的学习要求来简化学习到的流变换。研究人员研究了简化流变换的其他策略，特别是关注最优传输和积分路径之间的联系。用传输成本正则化CNF可以拉直积分路径并降低基于模拟的最大似然训练过程的计算成本 [5, 21]。最近，研究小组利用两个分布之间OT映射的小批量近似来产生更直的流，增强了训练和推理性能 [24, 30]。同时，Liu等人 [17] 解决了非线性最小二乘优化问题以寻找直耦合——而不是最优耦合——这可以在单个欧拉步长中积分。

在高维中学习具有表现力的混合模型是一项具有挑战性的任务。高维协方差估计有过拟合噪声的风险，并且矩阵可能变得病态或奇异 [15]。此外，存储满秩矩阵所需的内存随维度数量呈二次方增长。一种解决方案是将学习到的协方差矩阵约束为低秩，有效地将协方差建模为学习到的低维子空间上的满秩矩阵 [29]。建模低秩GMM的两种常见框架包括概率分量分析器混合模型 [29] 和因子分析器混合模型（MFA）[7]。在这项工作中，我们专注于MPPCA模型，因为它们可以用闭型期望最大化更新进行拟合。[26]使用MFA模型进行图像生成，证明低秩混合模型可以在全尺寸图像上进行训练，尽管维度很高。协方差矩阵自适应（CMA）是一种进化优化算法，它迭代地自适应协方差矩阵以提高样本效率 [10]。低秩更新使优化过程具有鲁棒性和样本效率 [13]。

### III 连续归一化流
我们概述了连续归一化流、流匹配目标和基于流的生成建模背后的基本理论。

#### III-A 连续归一化流
平滑、时变的向量场 $u_{t}:[0,1]\times\mathbb{R}^{d}\rightarrow\mathbb{R}^{d}$ 定义了一个常微分方程（ODE）：
$dx=u_{t}(x)dt$ (1)
我们将ODE解表示为 $\phi_{t}(x)$，这是一个微分同胚映射，它将点 $x$ 沿向量场从时间 $0$ 传输到时间 $t$，并具有初始条件 $\phi_{0}(x)=x$。给定概率分布 $p_{0}(x)$，映射 $\phi_{t}(x)$ 诱导一个前推密度：
$p_{t}(x)=p_{0}(\phi^{-1}_{t}(x))\left\lvert\det\left[\dfrac{\partial\phi^{-1}_{t}}{\partial x}(x)\right]\right\rvert$ (2)
这个时变密度由连续性方程 [30] 表征：
$\dfrac{\partial p}{\partial t}=-\nabla\cdot(p_{t}u_{t})$ (3)
[3] 用神经网络对向量场 $u_{t}$ 进行建模，创建了一个称为连续归一化流（CNF）的深度参数化生成模型。可以通过抽取样本 $x\sim p_{0}(x)$ 并沿向量场 $u$ 传输它们来获得 $p_{t}(x)$ 的样本。此外，可以使用公式2中的变量替换公式来评估密度 $p_{t}(x)$。以前，归一化流生成模型是通过堆叠离散的微分同胚变换集来创建的 [25]。通常，这些变换具有严格限制的架构，以确保可逆性或易于处理的雅可比行列式计算 [22]。然而，CNF允许不受限制的神经网络架构 [8]。

#### III-B 流匹配
早期的CNF模型通过最大似然进行训练——这是一个计算昂贵的过程，需要在每个训练步骤模拟ODE动力学以获得对数密度的瞬时变化 [8]。流匹配目标提供了一种无模拟的方法来训练CNF，通过直接回归到 $u$，类似于在扩散模型中回归随机微分方程的漂移项 [1]。考虑根据条件变量 $z$ 变化的概率路径混合 $p_{t}\left(x\mid z\right)$。我们可以将边缘概率路径 $p_{t}(x)$ 重写为：
$p_{t}(x)=\int p_{t}\left(x\mid z\right)q(z)dz$ (4)
其中 $q(z)$ 是条件变量上的分布。如果向量场 $u_{t}\left(x\mid z\right)$ 从初始条件 $p_{0}\left(x\mid z\right)$ 生成路径 $p_{t}\left(x\mid z\right)$，那么向量场：
$u_{t}(x)=\mathbb{E}_{q(z)}\dfrac{u_{t}\left(x\mid z\right)p_{t}\left(x\mid z\right)}{p_{t}(x)}$ (5)
生成路径 $p_{t}(x)$，前提是 $p_{t}$ 和 $u_{t}$ 满足公式3。当条件概率路径 $p_{t}\left(x\mid z\right)$ 和向量场 $u_{t}\left(x\mid z\right)$ 已知且具有简单形式时，我们可以获得一个无偏随机目标来回归公式5中的向量场 [19, 16, 1, 30]。设 $v_{\theta}(t,x):[0,1]\times\mathbb{R}^{d}\rightarrow\mathbb{R}^{d}$ 表示由权重为 $\theta$ 的神经网络参数化的时变向量场。条件流匹配目标：
$\mathcal{L}_{\mathrm{CFM}}(\theta)=\mathbb{E}_{t,\ q(z),\ p_{t}\left(x\mid z\right)}\lVert v_{\theta}(t,x)-u_{t}(x\mid z)\rVert^{2}$ (6)
允许我们仅使用来自 $p_{t}\left(x\mid z\right)$ 和 $u_{t}\left(x\mid z\right)$ 的样本来回归公式5中的边缘向量场。有关条件概率路径和向量场的常见形式的讨论，请参阅 [30]。

### IV MPPCA 基础分布
在III-A节中引入的初始概率分布 $p_{0}$ 通常是标准正态密度，这允许使用公式2进行易于处理的密度估计 [25, 21, 16]。[30] 展示了如何使用来自任意 $p_{0}$ 的样本进行流匹配；然而，如果 $p_{0}$ 没有解析的似然表达式，密度估计就不再可行。在这项工作中，我们提出用MPPCA模型表示 $p_{0}$，我们将在下一节中介绍。

#### IV-A 低秩混合模型
**图 2**：在概率PCA框架中，来自低维潜在空间的样本通过因子载荷矩阵投影到数据空间，该矩阵定义了主成分方向。
主成分分析（PCA）是一种经典的降维统计技术。[29] 在最大似然框架内重新表述了PCA，从而产生了相关的概率密度。考虑以下潜在变量模型：
$\mathbf{x}=\mathbf{W}\mathbf{z}+\bm{\upmu}+\bm{\upepsilon}$ (7)
$\mathbf{z}\sim\mathcal{N}(\mathbf{0},\mathbf{I})$ (8)
$\bm{\upepsilon}\sim\mathcal{N}(\mathbf{0},\sigma^{2}\mathbf{I})$ (9)
其中 $\mathbf{W}$ 是大小为 $d\times\ell$ 的矩形因子载荷矩阵，$\ell$ 是潜在维度，使得 $\ell\ll d$。潜在向量 $\mathbf{z}$ 的长度为 $\ell$，均值向量 $\bm{\upmu}$ 的长度为 $d$，$\bm{\upepsilon}$ 是具有对角协方差 $\sigma^{2}\mathbf{I}$ 的加性噪声。对于MPPCA，假设噪声是各向同性的；在更一般的MFA框架中，噪声假设放宽为仅仅是对角的。在各向同性噪声的情况下，隐含的条件分布是：
$p\left(\mathbf{x}\mid\mathbf{z}\right)=\left(2\pi\sigma^{2}\right)^{-d/2}\exp{\left\{-\dfrac{1}{2\sigma^{2}}\lVert\mathbf{x}-\mathbf{W}\mathbf{z}-\bm{\upmu}\rVert^{2}\right\}}$ (10)
潜在变量上的高斯先验由下式给出：
$p\left(\mathbf{z}\right)=\left(2\pi\right)^{-\ell/2}\exp{\left\{-\dfrac{1}{2}\mathbf{z}^{\top}\mathbf{z}\right\}}$ (11)
因此，$\mathbf{x}$ 上的边缘密度可以表示为：
$p\left(\mathbf{x}\right)=\eta\lvert\mathbf{C}\rvert^{-1/2}\exp{\left\{-\dfrac{1}{2}\left(\mathbf{x}-\bm{\upmu}\right)^{\top}\mathbf{C}^{-1}\left(\mathbf{x}-\bm{\upmu}\right)\right\}}$ (12)
归一化常数为 $\eta=\left(2\pi\right)^{-d/2}$，模型协方差为 $\mathbf{C}=\mathbf{W}\mathbf{W}^{\top}+\sigma^{2}\mathbf{I}$。当因子载荷矩阵 $\mathbf{W}$ 的列张成数据的主子空间时，数据集 $\{\mathbf{x}_{0},\mathbf{x}_{1},\ldots,\mathbf{x}_{N}\}$ 的似然性最大化 [29]。公式12定义了单个概率主成分分析器（PPCA）的边缘似然；多个PPCA模型可以混合组合，以学习局部主轴并建模更复杂的分布 [29]。图2展示了对于单个PPCA模型，低维潜在变量如何投影到数据空间，从而定义高斯边缘分布 $p\left(\mathbf{x}\right)$。

#### IV-B 拟合 MPPCA 模型
考虑如公式7中提出的 $K$ 个概率主成分分析器的混合。数据集 $\{\mathbf{x}_{0},\mathbf{x}_{1},\ldots,\mathbf{x}_{N}\}$ 的对数似然为：
$\mathcal{L}=\sum_{i=1}^{N}\log\left\{\sum_{k=1}^{K}\pi_{k}p\left(\mathbf{x}_{n}\mid k\right)\right\}$ (13)
其中 $p\left(\mathbf{x}\mid k\right)$ 表示第 $k$ 个PPCA模型的密度，$\pi_{k}$ 是相应的混合比例，满足 $\pi_{k}\geq 0$ 且 $\sum_{k=1}^{K}\pi_{k}=1$。[29] 推导出一种迭代期望最大化过程，对分量 $k=1,\ldots,K$ 的参数 $\mathbf{W}_{k}$、$\bm{\upmu}_{k}$、$\pi_{k}$ 和 $\sigma_{k}^{2}$ 进行闭型更新，保证能找到公式13的局部最大值。对于大型或高维数据集，EM过程也可以通过在小批量上累积充分统计量以内存高效的方式执行 [26]。

### V 实验
本节首先介绍我们的数据集和评估指标，然后讨论实验结果。

#### V-A 数据集
我们按照 [23] 的预处理步骤，对来自加州大学欧文分校机器学习库的三个表格数据集进行密度估计。这些数据集广泛用于基于流的生成建模基准 [4, 8, 21]。此外，我们在三个自然图像数据集上训练流：FashionMNIST [31]、CelebA [18] 和CIFAR-10 [14]。我们将CelebA数据集裁剪、归一化并调整为 $32\times 32$ 和 $64\times 64$。

#### V-B 指标
我们计算以下指标来评估学习到的生成模型的质量，并量化学习MPPCA基础分布的影响：
- **平均对数似然**：将留出的测试数据集通过学习到的映射 $\phi$ 向后积分进行变换，并根据公式2计算每个数据点的对数似然。值越高表示学习到的流密度更接近样本。
- **统计不同区间数（NDB）**：NDB指标是一种基于落入预定区间的样本相对比例来评估生成模型的简单方法 [26]。值越低表示学习到的分布更接近数据分布。我们除以区间数 $C$ 并报告统计不同区间的比例。
- **Fréchet inception距离指标（FID）**：FID是评估生成图像质量的标准指标，常见于生成对抗网络文献 [11]。特别是，我们使用预训练的InceptionV3模型第三层生成的嵌入来计算FID指标，这是标准做法。值越低表示学习到的分布更接近数据分布。
- **函数评估次数（NFE）**：我们报告自适应步长ODE求解器在预定数值容差下生成积分映射 $\phi$ 所需的平均函数评估次数。NFE值越高表示学习到的ODE动力学越复杂，由于求解器步数增加，导致推理时的计算负担更大 [5, 16]。
我们报告UCI数据集的对数似然指标和图像数据集的NDB指标。在所有实验中，我们报告所需的平均NFE以及总训练时间。总训练时间包括拟合MPPCA基础分布所需的时间。

#### V-C 实验设置

### VI MPPCA 考虑因素
接下来我们检查计算考虑因素和潜在因子超参数的重要性。

#### VI-A 计算开销
学习MPPCA基础引入了额外的计算开销，因为需要在流训练之前单独拟合混合模型。与标准正态基础不同，MPPCA需要学习聚类均值、因子载荷矩阵、噪声方差和混合系数。具有 $K$ 个分量的MPPCA模型的总参数数为 $K(d\ell+d+1)+(K-1)$。与整体训练过程相比，拟合MPPCA模型所需的时间最少，在所有图像生成实验中占总训练时间的不到3%，如表IV所示。

### VII 讨论
我们提出了一种使用低秩混合基础分布简化流匹配变换的技术。概率主成分分析器混合模型是一种参数高效的模型，即使在高维空间中，也可以通过期望最大化进行解析更新。用MPPCA基础密度初始化流匹配作为训练过程的归纳偏置，减少了流学习复杂变换的负担。我们表明，与标准正态基础密度相比，MPPCA基础分布可以与连续归一化流相结合，以生成更高质量的样本并减少推理时所需的积分步数。未来的工作将探索将MPPCA拟合过程扩展到更高维度的技术，例如特征采样或使用受限K均值初始化混合分量聚类。我们还将评估MPPCA基础密度与其他流匹配目标（如动作匹配 [19] 和薛定谔桥流匹配 [30]）结合时的简化效果。
